# /etc/nginx/sites-available/hungdv.io.vn
# After DNS points here, run: sudo certbot --nginx -d hungdv.io.vn -d www.hungdv.io.vn
# Certbot adds the 443 server block and the HTTP→HTTPS redirect.

map $http_accept_language $home_lang {
    default  en;
    ~*^vi    vi;
}

server {
    listen 80;
    listen [::]:80;
    server_name hungdv.io.vn www.hungdv.io.vn;

    root /var/www/hungdv.io.vn;
    index index.html;

    location = / {
        add_header Vary "Accept-Language" always;
        return 302 /$home_lang/;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json text/plain application/xml;
    gzip_min_length 1024;

    # hashed file names: safe to cache for a year.
    # No add_header in these locations: any add_header here drops the server-level security headers.
    location /_next/static/ {
        expires 1y;
        try_files $uri =404;
    }

    location /demo/ {
        expires 30d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
